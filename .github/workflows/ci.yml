name: CI

# Deploy do Vercel Git integration đảm nhiệm (repo thuộc chính chủ minkoi007cs).
# Workflow này chỉ chặn merge khi build/typecheck lỗi.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
